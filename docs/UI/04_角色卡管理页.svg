<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <title>角色卡管理页设计</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="44" dominant-baseline="central" font-size="14" font-weight="500" fill="#333333">角色卡管理 · 联系人列表 + 详情/编辑页</text>

  <rect x="40" y="70" width="280" height="360" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
  <rect x="40" y="70" width="280" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="48" y="76" width="150" height="20" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="56" y="86" dominant-baseline="central" font-size="11" fill="#888780">搜索角色…</text>
  <rect x="206" y="76" width="52" height="20" rx="4" fill="#0F6E56"/>
  <text x="232" y="86" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FFFFFF">+ 新建</text>
  <rect x="262" y="76" width="50" height="20" rx="4" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="287" y="86" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">导入</text>

  <rect x="48" y="110" width="264" height="56" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <circle cx="74" cy="138" r="18" fill="#534AB7"/>
  <text x="74" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#FFFFFF">A</text>
  <text x="100" y="128" dominant-baseline="central" font-size="11" font-weight="500" fill="#333333">角色A</text>
  <text x="100" y="146" dominant-baseline="central" font-size="11" fill="#888780">温柔的AI助手 · 12 会话</text>

  <rect x="48" y="172" width="264" height="56" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <circle cx="74" cy="200" r="18" fill="#185FA5"/>
  <text x="74" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#FFFFFF">B</text>
  <text x="100" y="190" dominant-baseline="central" font-size="11" font-weight="500" fill="#185FA5">角色B（查看中）</text>
  <text x="100" y="208" dominant-baseline="central" font-size="11" fill="#888780">冒险家 · 8 会话</text>

  <rect x="48" y="234" width="264" height="56" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <circle cx="74" cy="262" r="18" fill="#0F6E56"/>
  <text x="74" y="262" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#FFFFFF">C</text>
  <text x="100" y="252" dominant-baseline="central" font-size="11" font-weight="500" fill="#333333">角色C</text>
  <text x="100" y="270" dominant-baseline="central" font-size="11" fill="#888780">毒舌学者 · 3 会话</text>

  <rect x="48" y="296" width="264" height="56" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <circle cx="74" cy="324" r="18" fill="#854F0B"/>
  <text x="74" y="324" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#FFFFFF">D</text>
  <text x="100" y="314" dominant-baseline="central" font-size="11" font-weight="500" fill="#333333">角色D</text>
  <text x="100" y="332" dominant-baseline="central" font-size="11" fill="#888780">原创角色 · 0 会话</text>

  <text x="180" y="400" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#378ADD">单击卡片 → 右侧打开详情/编辑</text>

  <line x1="324" y1="250" x2="354" y2="250" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="234" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#854F0B">点卡片</text>

  <rect x="360" y="70" width="280" height="360" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>
  <rect x="360" y="70" width="280" height="28" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="368" y="84" dominant-baseline="central" font-size="11" font-weight="500" fill="#085041">‹ 角色卡 · 角色B</text>
  <text x="632" y="84" text-anchor="end" dominant-baseline="central" font-size="11" fill="#0F6E56">导出 PNG ⤓</text>

  <rect x="368" y="104" width="52" height="52" rx="8" fill="#534AB7"/>
  <text x="394" y="130" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#FFFFFF">B</text>
  <rect x="430" y="108" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="438" y="120" dominant-baseline="central" font-size="11" fill="#333333">角色B</text>
  <text x="430" y="146" dominant-baseline="central" font-size="11" fill="#185FA5">#原创 #冒险</text>

  <text x="368" y="172" dominant-baseline="central" font-size="11" font-weight="500" fill="#0F6E56">基本信息</text>
  <text x="368" y="190" dominant-baseline="central" font-size="11" fill="#5F5E5A">描述</text>
  <rect x="368" y="198" width="264" height="36" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="376" y="216" dominant-baseline="central" font-size="11" fill="#888780">角色描述 description…</text>

  <text x="368" y="244" dominant-baseline="central" font-size="11" fill="#5F5E5A">性格</text>
  <rect x="368" y="252" width="264" height="28" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="376" y="266" dominant-baseline="central" font-size="11" fill="#888780">性格 personality…</text>

  <text x="368" y="290" dominant-baseline="central" font-size="11" fill="#5F5E5A">场景</text>
  <rect x="368" y="298" width="264" height="28" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="376" y="312" dominant-baseline="central" font-size="11" fill="#888780">场景 scenario…</text>

  <text x="368" y="336" dominant-baseline="central" font-size="11" fill="#5F5E5A">首条消息</text>
  <rect x="368" y="344" width="264" height="32" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="376" y="360" dominant-baseline="central" font-size="11" fill="#888780">first_mes…（含备选问候切换）</text>

  <rect x="368" y="388" width="76" height="26" rx="4" fill="#0F6E56"/>
  <text x="406" y="401" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">保存</text>
  <rect x="452" y="388" width="76" height="26" rx="4" fill="#FFFFFF" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="490" y="401" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#A32D2D">删除</text>
  <text x="632" y="401" text-anchor="end" dominant-baseline="central" font-size="11" fill="#185FA5">高级字段 ▸</text>

  <text x="40" y="456" dominant-baseline="central" font-size="12" fill="#5F5E5A">· 导入：支持 ST 标准 PNG 角色卡（内嵌数据）与 JSON，导入后自动进列表</text>
  <text x="40" y="476" dominant-baseline="central" font-size="12" fill="#5F5E5A">· 删除需二次确认；导出为标准 PNG 卡，与 ST 生态双向互通</text>
  <text x="40" y="496" dominant-baseline="central" font-size="12" fill="#5F5E5A">· 字段对齐 ST 角色卡规范：描述/性格/场景/首条消息/备选问候，高级字段折叠（系统提示/tags等）</text>
</svg>
