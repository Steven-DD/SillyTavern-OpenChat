<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470">
  <title>设置页与插件页 · 三栏一致性修正版</title>

  <text x="20" y="26" dominant-baseline="central" font-size="15" font-weight="600" fill="#333333">设置页 / 插件页 · 三栏一致性修正</text>
  <text x="20" y="46" dominant-baseline="central" font-size="11" fill="#888780">左栏四入口全局固定（同微信）；中栏 = 二级列表；右栏 = 内容区。不再使用独立页面。</text>

  <!-- ===== 窗口1：设置模式 ===== -->
  <rect x="20" y="62" width="310" height="24" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="30" y="74" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">① 设置模式</text>

  <rect x="20" y="86" width="310" height="310" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>

  <!-- 左栏（固定） -->
  <rect x="20" y="86" width="40" height="310" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="26" y="100" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="40" y="114" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">会</text>
  <rect x="26" y="136" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="40" y="150" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">联</text>
  <rect x="26" y="172" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="40" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">插</text>
  <rect x="26" y="208" width="28" height="28" rx="6" fill="#534AB7" stroke="#3C3489" stroke-width="1"/>
  <text x="40" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">设</text>
  <rect x="20" y="208" width="3" height="28" fill="#534AB7"/>

  <!-- 中栏：设置分类 -->
  <rect x="60" y="86" width="110" height="310" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="70" y="106" dominant-baseline="central" font-size="12" font-weight="500" fill="#444441">设置</text>
  <rect x="60" y="120" width="110" height="34" fill="#E6F1FB"/>
  <rect x="60" y="120" width="3" height="34" fill="#185FA5"/>
  <text x="72" y="137" dominant-baseline="central" font-size="12" font-weight="500" fill="#185FA5">API 与模型</text>
  <text x="72" y="171" dominant-baseline="central" font-size="12" fill="#444441">Persona</text>
  <text x="72" y="205" dominant-baseline="central" font-size="12" fill="#444441">界面偏好</text>
  <text x="72" y="239" dominant-baseline="central" font-size="12" fill="#444441">数据</text>

  <!-- 右栏：API 表单 -->
  <rect x="170" y="86" width="160" height="310" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="182" y="106" dominant-baseline="central" font-size="12" font-weight="500" fill="#333333">API 与模型</text>
  <line x1="170" y1="118" x2="330" y2="118" stroke="#B4B2A9" stroke-width="0.5"/>

  <text x="182" y="136" dominant-baseline="central" font-size="10" fill="#888780">API 地址</text>
  <rect x="182" y="144" width="136" height="24" rx="5" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="190" y="156" dominant-baseline="central" font-size="10" fill="#888780">http://127.0.0.1:8000</text>

  <text x="182" y="184" dominant-baseline="central" font-size="10" fill="#888780">API 密钥</text>
  <rect x="182" y="192" width="136" height="24" rx="5" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="190" y="204" dominant-baseline="central" font-size="10" fill="#888780">sk-********</text>

  <text x="182" y="232" dominant-baseline="central" font-size="10" fill="#888780">模型</text>
  <rect x="182" y="240" width="136" height="24" rx="5" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="190" y="252" dominant-baseline="central" font-size="10" fill="#444441">gpt-4o</text>
  <text x="310" y="252" text-anchor="end" dominant-baseline="central" font-size="10" fill="#888780">▾</text>

  <rect x="182" y="276" width="136" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="250" y="289" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#0F6E56">连接测试</text>

  <circle cx="188" cy="320" r="4" fill="#3B6D11"/>
  <text x="198" y="320" dominant-baseline="central" font-size="10" fill="#3B6D11">已连接 · 延迟 230ms</text>

  <!-- ===== 窗口2：插件模式 ===== -->
  <rect x="350" y="62" width="310" height="24" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="360" y="74" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">② 插件模式</text>

  <rect x="350" y="86" width="310" height="310" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.5"/>

  <!-- 左栏（固定） -->
  <rect x="350" y="86" width="40" height="310" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="356" y="100" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="370" y="114" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">会</text>
  <rect x="356" y="136" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="370" y="150" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">联</text>
  <rect x="356" y="172" width="28" height="28" rx="6" fill="#534AB7" stroke="#3C3489" stroke-width="1"/>
  <text x="370" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">插</text>
  <rect x="350" y="172" width="3" height="28" fill="#534AB7"/>
  <rect x="356" y="208" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <text x="370" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">设</text>

  <!-- 中栏：插件列表 -->
  <rect x="390" y="86" width="110" height="310" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="400" y="106" dominant-baseline="central" font-size="12" font-weight="500" fill="#444441">扩展插件</text>

  <rect x="390" y="120" width="110" height="34" fill="#E6F1FB"/>
  <rect x="390" y="120" width="3" height="34" fill="#185FA5"/>
  <circle cx="400" cy="131" r="3" fill="#3B6D11"/>
  <text x="408" y="131" dominant-baseline="central" font-size="12" font-weight="500" fill="#185FA5">总结记忆</text>
  <text x="408" y="146" dominant-baseline="central" font-size="10" fill="#888780">ST 扩展 · 启用</text>

  <circle cx="400" cy="171" r="3" fill="#3B6D11"/>
  <text x="408" y="171" dominant-baseline="central" font-size="12" fill="#444441">向量存储</text>
  <text x="408" y="186" dominant-baseline="central" font-size="10" fill="#888780">ST 扩展 · 启用</text>

  <circle cx="400" cy="205" r="3" fill="#3B6D11"/>
  <text x="408" y="205" dominant-baseline="central" font-size="12" fill="#444441">作者注释</text>
  <text x="408" y="220" dominant-baseline="central" font-size="10" fill="#888780">ST 扩展 · 启用</text>

  <circle cx="400" cy="239" r="3" fill="#B4B2A9"/>
  <text x="408" y="239" dominant-baseline="central" font-size="12" fill="#888780">表情</text>
  <text x="408" y="254" dominant-baseline="central" font-size="10" fill="#888780">ST 扩展 · 停用</text>

  <rect x="398" y="272" width="94" height="26" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="445" y="285" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">+ 安装扩展</text>

  <!-- 右栏：插件详情 -->
  <rect x="500" y="86" width="160" height="310" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="512" y="106" dominant-baseline="central" font-size="12" font-weight="500" fill="#333333">总结记忆</text>
  <line x1="500" y1="118" x2="660" y2="118" stroke="#B4B2A9" stroke-width="0.5"/>

  <rect x="512" y="130" width="30" height="16" rx="4" fill="#0F6E56"/>
  <text x="527" y="138" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#FFFFFF">启用</text>
  <text x="550" y="138" dominant-baseline="central" font-size="10" fill="#888780">长对话自动摘要</text>

  <text x="512" y="172" dominant-baseline="central" font-size="10" fill="#888780">摘要触发（轮数）</text>
  <rect x="512" y="180" width="60" height="24" rx="5" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="520" y="192" dominant-baseline="central" font-size="10" fill="#444441">8</text>

  <text x="512" y="220" dominant-baseline="central" font-size="10" fill="#888780">注入位置</text>
  <rect x="512" y="228" width="136" height="24" rx="5" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
  <text x="520" y="240" dominant-baseline="central" font-size="10" fill="#444441">系统提示词末尾</text>
  <text x="640" y="240" text-anchor="end" dominant-baseline="central" font-size="10" fill="#888780">▾</text>

  <text x="512" y="276" dominant-baseline="central" font-size="10" fill="#888780">说明</text>
  <rect x="512" y="284" width="136" height="44" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="520" y="298" dominant-baseline="central" font-size="10" fill="#5F5E5A">走 ST API，配置保存到</text>
  <text x="520" y="314" dominant-baseline="central" font-size="10" fill="#5F5E5A">ST 后端 settings.json</text>

  <rect x="512" y="344" width="60" height="24" rx="6" fill="#0F6E56"/>
  <text x="542" y="356" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#FFFFFF">保存</text>

  <!-- 底部一致性规则 -->
  <rect x="20" y="412" width="640" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="34" y="428" dominant-baseline="central" font-size="11" font-weight="500" fill="#0C447C">一致性规则（阶段三前端布局硬约束）</text>
  <text x="34" y="446" dominant-baseline="central" font-size="11" fill="#0C447C">左栏四入口（会话 / 联系人 / 插件 / 设置）全局固定；中栏与右栏内容随入口路由切换；设置与插件不使用独立页面。</text>
</svg>
