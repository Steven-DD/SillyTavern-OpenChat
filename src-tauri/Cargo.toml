[package]
name = "st-chat"
version = "0.1.0"
edition = "2021"

[lib]
name = "st_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# 原生文件对话框（数据导入/导出选路径）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 角色卡 PNG tEXt chunk 的 base64 编解码（ST character-card-parser.js 同语义）
base64 = "0.22"
# characters 族 create/import/edit 的 multipart/form-data 解析（multer 等价，
# 对齐 ST server-main.js 的 single('avatar') 语义）
multer = "3"
tokio = { version = "1", features = ["full"] }

# HTTP 中继（生产环境跨源方案）：Rust 侧反向代理到 ST，
# 保留 Cookie（解决 CSRF 双提交）+ 流式透传（SSE 不缓冲）
axum = "0.7"
# SSE 事件转换透传用 Buffer 类型（reqwest 已在依赖树中）
bytes = "1"
# 只走 127.0.0.1 明文 http，不需要 TLS；stream 用于 SSE 透传。
# ⚠ rustls-tls 是给 **组件下载器**（S4）用的 —— 它要下 HTTPS 资源；
#   中继本身仍用明文环回，不受影响。
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
# 插件清单里的版本号提取用（tauri-utils 已在依赖树中，不增加编译成本）
regex = "1"
# S4 下载器：sha256 校验（边下边算）+ zip 解压（ST 源码快照是 zip）
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 中继鉴权 token 的随机源（0.2 已在依赖树中，直接复用）
getrandom = "0.2"
# custom 源的 custom_include_body / custom_exclude_body 是 YAML 通道（ST mergeObjectWithYaml 同语义）
serde_yaml = "0.9"
# T16：NovelAI erato 的 llama3 精确编码（ST WebTokenizer Corresponding wasm 库同格式）
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# SPM（SentencePiece）NFKC 规格化的 Unicode 面（nerdstash_v2 分段）
unicode-normalization = "0.1"
# T16 批7：openai /count 的 tiktoken 精确层（cl100k/o200k 内置词表）
tiktoken-rs = "0.6"
# T12：OS keychain vault（Windows CredMan / macOS Keychain / Linux secret service）
keyring = "3"
# T14：扩展 git 安装（libgit2 本地库实现 —— 不走 system git，消除命令执行向量；
# git2 不读全局 gitconfig 的 url.*.insteadOf（评审 P1-1 关键面）
git2 = { version = "0.19", default-features = false, features = ["https"] }
# 应用内自动更新 + 重启（发布线）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 日志（操作审计 + 调试：console + 滚动文件，前端 @tauri-apps/plugin-log 配套）
tauri-plugin-log = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
