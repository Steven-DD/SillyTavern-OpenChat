[package]
name = "st-chat"
version = "0.1.0"
edition = "2021"

[lib]
name = "st_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 原生文件对话框（数据导入/导出选路径）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 统一日志门面：后端全量日志走 log crate，由 tauri-plugin-log 落滚动文件（生产可诊断）
log = "0.4"
# 角色卡 PNG tEXt chunk 的 base64 编解码（ST character-card-parser.js 同语义）
base64 = "0.22"
# characters 族 create/import/edit 的 multipart/form-data 解析（multer 等价，
# 对齐 ST server-main.js 的 single('avatar') 语义）
multer = "3"
tokio = { version = "1", features = ["full"] }

# 本地 HTTP 后端（数据服务本体；鉴权 + CORS + SSE 直出）
axum = "0.7"
# SSE 事件转换透传用 Buffer 类型（reqwest 已在依赖树中）
bytes = "1"
# 上游 provider 出站 + SSE 流式透传（rustls-tls 供 HTTPS 上游）
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
# sha256（data-maid 文件哈希 / chats 备份 key）+ zip 解压（数据袋导入/导出）
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 鉴权 token / uuid / token 的随机源（OS CSPRNG）
getrandom = "0.2"
# custom 源的 custom_include_body / custom_exclude_body 是 YAML 通道（ST mergeObjectWithYaml 同语义）
serde_yaml = "0.9"
# T16：NovelAI erato 的 llama3 精确编码（ST WebTokenizer Corresponding wasm 库同格式）
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# SPM（SentencePiece）NFKC 规格化的 Unicode 面（nerdstash_v2 分段）
unicode-normalization = "0.1"
# T16 批7：openai /count 的 tiktoken 精确层（cl100k/o200k 内置词表）
tiktoken-rs = "0.6"
# T12：OS keychain vault（Windows CredMan / macOS Keychain / Linux secret service）
keyring = "3"
# T14：扩展 git 安装（libgit2 本地库实现 —— 不走 system git，消除命令执行向量；
# S19：install/update 前探测全局 gitconfig 的 url.*.insteadOf，命中即拒 400
# —— libgit2 对 insteadOf 的 URL 重写支持不完整且版本相关，不能依赖其缺席，须显式设防）
git2 = { version = "0.19", default-features = false, features = ["https"] }
# HIGH-1：thumbnail/sprites query 值与静态路径段的 percent-decode（先解码再过 pathguard）
percent-encoding = "2"
# vertexai full 模式：服务账号 JWT(RS256) → OAuth2 access token 交换
jsonwebtoken = "9"
# 应用内自动更新 + 重启（发布线）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 日志（操作审计 + 调试：console + 滚动文件，前端 @tauri-apps/plugin-log 配套）
tauri-plugin-log = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

# native 冒烟/浏览器自动化的独立后端宿主（smoke-browser.mjs 用）
[[bin]]
name = "backend-host"
path = "src/bin/backend_host.rs"
