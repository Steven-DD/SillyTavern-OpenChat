[package]
name = "st-chat"
version = "0.1.0"
edition = "2021"

[lib]
name = "st_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# 原生文件对话框（数据导入/导出选路径）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# HTTP 中继（生产环境跨源方案）：Rust 侧反向代理到 ST，
# 保留 Cookie（解决 CSRF 双提交）+ 流式透传（SSE 不缓冲）
axum = "0.7"
# 只走 127.0.0.1 明文 http，不需要 TLS；stream 用于 SSE 透传。
# ⚠ rustls-tls 是给 **组件下载器**（S4）用的 —— 它要下 HTTPS 资源；
#   中继本身仍用明文环回，不受影响。
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
# 插件清单里的版本号提取用（tauri-utils 已在依赖树中，不增加编译成本）
regex = "1"
# S4 下载器：sha256 校验（边下边算）+ zip 解压（ST 源码快照是 zip）
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 中继鉴权 token 的随机源（0.2 已在依赖树中，直接复用）
getrandom = "0.2"
# 应用内自动更新 + 重启（发布线）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
